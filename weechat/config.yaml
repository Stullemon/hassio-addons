name: WeeChat
version: "0.1.3"
slug: weechat
description: >-
  Headless WeeChat app with relay and access to /share (for DCC downloads).
url: https://github.com/Stullemon/hassio-addons
codeowners:
  - "@Stullemon"
documentation: https://github.com/Stullemon/hassio-addons/blob/main/weechat/README.md
support: https://github.com/Stullemon/hassio-addons/issues
issue_tracker: https://github.com/Stullemon/hassio-addons/issues
arch:
  - aarch64
  - amd64
  - armv7

startup: services
boot: auto
init: false
host_network: true
homeassistant_api: true

options:
  relay_port: 9001
  relay_password: superstrongpassword
  auto_accept_dcc: false
  enable_monitor_script: false

schema:
  relay_port: int
  relay_password: str
  auto_accept_dcc: bool
  enable_monitor_script: bool

map:
  - config:rw
  - share:rw
